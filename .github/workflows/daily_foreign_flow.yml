name: Daily Foreign Flow Collection

on:
  schedule:
    # 10:00 UTC daily = 17:00 ICT
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: market-bot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Branch tip, not the triggering SHA: an earlier queued bot run may have pushed since.
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect foreign flow
        timeout-minutes: 5
        run: python weekly_bot.py --collect-foreign-flow
      - name: Commit cache
        run: |
          git config user.name "Market Bot"
          git config user.email "bot@truonghuyresearch.xyz"
          # Stage bot output only; tools must never sweep other files into the repo.
          git add -- src/content/market-views/_foreign_flow_cache.json
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "cache: foreign flow"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Market bot failing: $GITHUB_WORKFLOW"
          body="Run failed on $(date -u +%Y-%m-%dT%H:%MZ) ($GITHUB_EVENT_NAME): $RUN_URL"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body

          Each further failure adds a comment here. Close this issue once the workflow is green again."
          fi
