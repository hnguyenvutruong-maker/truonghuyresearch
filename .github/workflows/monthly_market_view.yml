name: Monthly Market View

on:
  schedule:
    # 10:00 UTC on possible month-end dates = 17:00 ICT.
    # A guard step below runs generation only when tomorrow is the 1st in Asia/Saigon.
    - cron: '0 10 28-31 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Target month (YYYY-MM) for a backfill; empty = default month'
        required: false
        default: ''

concurrency:
  group: market-bot
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check month-end in ICT
        id: month_end
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tomorrow_day="$(TZ=Asia/Ho_Chi_Minh date -d 'tomorrow' +%d)"
          if [ "$tomorrow_day" = "01" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.month_end.outputs.run == 'true'
        with:
          # Branch tip, not the triggering SHA: an earlier queued bot run may have pushed since.
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        if: steps.month_end.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.month_end.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Collect month-end foreign flow
        if: steps.month_end.outputs.run == 'true'
        # Best effort: the daily workflow reports collection failures; the note can still be written.
        continue-on-error: true
        timeout-minutes: 5
        run: python weekly_bot.py --collect-foreign-flow

      - name: Generate monthly market view
        if: steps.month_end.outputs.run == 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-5.2' }}
          MONTH: ${{ inputs.month }}
        run: python monthly_bot.py ${MONTH:+--month "$MONTH"}

      - name: Commit and push if new content
        if: steps.month_end.outputs.run == 'true'
        run: |
          git config user.name "Market Bot"
          git config user.email "bot@truonghuyresearch.xyz"
          # Stage bot output only; tools must never sweep other files into the repo.
          git add -- src/content/market-views src/content/monthly-views
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "monthly: market view"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Market bot failing: $GITHUB_WORKFLOW"
          body="Run failed on $(date -u +%Y-%m-%dT%H:%MZ) ($GITHUB_EVENT_NAME): $RUN_URL"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body

          Each further failure adds a comment here. Close this issue once the workflow is green again."
          fi
